AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Amazon Kinesis infrastructure for the
  AI-Assisted Threat Detection Dashboard.

###########################################################################
# Parameters
###########################################################################

Parameters:

  Environment:

    Type: String

    Default: dev

    AllowedValues:

      - dev
      - test
      - prod

###########################################################################
# Resources
###########################################################################

Resources:

###########################################################################
# Kinesis Data Stream
###########################################################################

  ThreatDetectionStream:

    Type: AWS::Kinesis::Stream

    Properties:

      Name:

        Fn::Sub: ThreatDetectionStream-${Environment}

      ShardCount: 1

      RetentionPeriodHours: 24

      StreamEncryption:

        EncryptionType: KMS

        KeyId: alias/aws/kinesis

      Tags:

        - Key: Project

          Value: AI-Assisted Threat Detection Dashboard

        - Key: Environment

          Value:

            Ref: Environment

###########################################################################
# CloudWatch Log Group
###########################################################################

  FirehoseLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:

        Fn::Sub: /aws/kinesisfirehose/${Environment}

      RetentionInDays: 30

###########################################################################
# CloudWatch Log Stream
###########################################################################

  FirehoseLogStream:

    Type: AWS::Logs::LogStream

    Properties:

      LogGroupName:

        Ref: FirehoseLogGroup

      LogStreamName: FirehoseDelivery

###########################################################################
# Firehose IAM Role
###########################################################################

  FirehoseRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:

        Fn::Sub: ThreatDetectionFirehoseRole-${Environment}

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:

              Service:

                - firehose.amazonaws.com

            Action:

              - sts:AssumeRole

      Policies:

        - PolicyName: FirehosePolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:

                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject

                Resource:

                  - Fn::Sub: arn:aws:s3:::ai-threat-processed-${Environment}-${AWS::AccountId}

                  - Fn::Sub: arn:aws:s3:::ai-threat-processed-${Environment}-${AWS::AccountId}/*

              - Effect: Allow

                Action:

                  - logs:PutLogEvents

                Resource: "*"

###########################################################################
# Firehose Delivery Stream
###########################################################################

  ThreatDetectionFirehose:

    Type: AWS::KinesisFirehose::DeliveryStream

    Properties:

      DeliveryStreamName:

        Fn::Sub: ThreatDetectionFirehose-${Environment}

      DeliveryStreamType: DirectPut

      ExtendedS3DestinationConfiguration:

        BucketARN:

          Fn::Sub: arn:aws:s3:::ai-threat-processed-${Environment}-${AWS::AccountId}

        RoleARN:

          Fn::GetAtt:

            - FirehoseRole

            - Arn

        Prefix: firehose/

        CloudWatchLoggingOptions:

          Enabled: true

          LogGroupName:

            Ref: FirehoseLogGroup

          LogStreamName:

            Ref: FirehoseLogStream

###########################################################################
# Kinesis Analytics IAM Role
###########################################################################

  KinesisAnalyticsRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:

        Fn::Sub: ThreatDetectionAnalyticsRole-${Environment}

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:

              Service:

                - kinesisanalytics.amazonaws.com

            Action:

              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonKinesisFullAccess

###########################################################################
# Analytics Application
###########################################################################

  ThreatDetectionAnalytics:

    Type: AWS::KinesisAnalyticsV2::Application

    Properties:

      ApplicationName:

        Fn::Sub: ThreatDetectionAnalytics-${Environment}

      RuntimeEnvironment: SQL-1_0

      ServiceExecutionRole:

        Fn::GetAtt:

          - KinesisAnalyticsRole

          - Arn

      ApplicationConfiguration:

        ApplicationCodeConfiguration:

          CodeContent:

            TextContent: |

              CREATE OR REPLACE STREAM DESTINATION_SQL_STREAM (
                  eventId VARCHAR(64),
                  severity VARCHAR(32),
                  score DOUBLE
              );

          CodeContentType: PLAINTEXT

###########################################################################
# CloudWatch Alarm
###########################################################################

  IncomingRecordsAlarm:

    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:

        Fn::Sub: KinesisIncomingRecords-${Environment}

      Namespace: AWS/Kinesis

      MetricName: IncomingRecords

      Dimensions:

        - Name: StreamName

          Value:

            Ref: ThreatDetectionStream

      Statistic: Sum

      Period: 300

      EvaluationPeriods: 1

      Threshold: 1

      ComparisonOperator: LessThanThreshold

      TreatMissingData: notBreaching

###########################################################################
# Write Alarm
###########################################################################

  WriteProvisionedAlarm:

    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:

        Fn::Sub: KinesisWriteProvisioned-${Environment}

      Namespace: AWS/Kinesis

      MetricName: WriteProvisionedThroughputExceeded

      Dimensions:

        - Name: StreamName

          Value:

            Ref: ThreatDetectionStream

      Statistic: Sum

      Period: 300

      EvaluationPeriods: 1

      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: notBreaching

###########################################################################
# Outputs
###########################################################################

Outputs:

  KinesisStreamName:

    Value:

      Ref: ThreatDetectionStream

  KinesisStreamArn:

    Value:

      Fn::GetAtt:

        - ThreatDetectionStream

        - Arn

  FirehoseArn:

    Value:

      Fn::GetAtt:

        - ThreatDetectionFirehose

        - Arn

  AnalyticsApplication:

    Value:

      Ref: ThreatDetectionAnalytics

  FirehoseRoleArn:

    Value:

      Fn::GetAtt:

        - FirehoseRole

        - Arn

  AnalyticsRoleArn:

    Value:

      Fn::GetAtt:

        - KinesisAnalyticsRole

        - Arn