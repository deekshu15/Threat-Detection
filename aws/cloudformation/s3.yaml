AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Amazon S3 infrastructure for the
  AI-Assisted Threat Detection Dashboard.

###########################################################################
# Parameters
###########################################################################

Parameters:

  Environment:

    Type: String

    Default: dev

    AllowedValues:

      - dev
      - test
      - prod

###########################################################################
# Resources
###########################################################################

Resources:

###########################################################################
# Raw Logs Bucket
###########################################################################

  RawLogsBucket:

    Type: AWS::S3::Bucket

    Properties:

      BucketName:

        Fn::Sub: ai-threat-raw-logs-${Environment}-${AWS::AccountId}

      VersioningConfiguration:

        Status: Enabled

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      LifecycleConfiguration:

        Rules:

          - Id: RawLogsLifecycle

            Status: Enabled

            Transitions:

              - TransitionInDays: 30

                StorageClass: STANDARD_IA

              - TransitionInDays: 90

                StorageClass: GLACIER

            ExpirationInDays: 365

      Tags:

        - Key: Project

          Value: AI-Assisted Threat Detection Dashboard

        - Key: Environment

          Value:

            Ref: Environment

###########################################################################
# Processed Logs Bucket
###########################################################################

  ProcessedLogsBucket:

    Type: AWS::S3::Bucket

    Properties:

      BucketName:

        Fn::Sub: ai-threat-processed-${Environment}-${AWS::AccountId}

      VersioningConfiguration:

        Status: Enabled

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      LifecycleConfiguration:

        Rules:

          - Id: ProcessedLogsLifecycle

            Status: Enabled

            Transitions:

              - TransitionInDays: 60

                StorageClass: STANDARD_IA

              - TransitionInDays: 180

                StorageClass: GLACIER

            ExpirationInDays: 730

      Tags:

        - Key: Project

          Value: AI-Assisted Threat Detection Dashboard

        - Key: Environment

          Value:

            Ref: Environment

###########################################################################
# Machine Learning Models Bucket
###########################################################################

  ModelsBucket:

    Type: AWS::S3::Bucket

    Properties:

      BucketName:

        Fn::Sub: ai-threat-models-${Environment}-${AWS::AccountId}

      VersioningConfiguration:

        Status: Enabled

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      Tags:

        - Key: Project

          Value: AI-Assisted Threat Detection Dashboard

        - Key: Environment

          Value:

            Ref: Environment

###########################################################################
# Reports Bucket
###########################################################################

  ReportsBucket:

    Type: AWS::S3::Bucket

    Properties:

      BucketName:

        Fn::Sub: ai-threat-reports-${Environment}-${AWS::AccountId}

      VersioningConfiguration:

        Status: Enabled

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      Tags:

        - Key: Project

          Value: AI-Assisted Threat Detection Dashboard

        - Key: Environment

          Value:

            Ref: Environment

###########################################################################
# Outputs
###########################################################################

Outputs:

  RawLogsBucketName:

    Description: Raw Logs Bucket Name

    Value:

      Ref: RawLogsBucket

    Export:

      Name:

        Fn::Sub: RawLogsBucket-${Environment}

  RawLogsBucketArn:

    Description: Raw Logs Bucket ARN

    Value:

      Fn::GetAtt:

        - RawLogsBucket

        - Arn

  ProcessedLogsBucketName:

    Description: Processed Logs Bucket Name

    Value:

      Ref: ProcessedLogsBucket

    Export:

      Name:

        Fn::Sub: ProcessedLogsBucket-${Environment}

  ProcessedLogsBucketArn:

    Description: Processed Logs Bucket ARN

    Value:

      Fn::GetAtt:

        - ProcessedLogsBucket

        - Arn

  ModelsBucketName:

    Description: Models Bucket Name

    Value:

      Ref: ModelsBucket

    Export:

      Name:

        Fn::Sub: ModelsBucket-${Environment}

  ModelsBucketArn:

    Description: Models Bucket ARN

    Value:

      Fn::GetAtt:

        - ModelsBucket

        - Arn

  ReportsBucketName:

    Description: Reports Bucket Name

    Value:

      Ref: ReportsBucket

    Export:

      Name:

        Fn::Sub: ReportsBucket-${Environment}

  ReportsBucketArn:

    Description: Reports Bucket ARN

    Value:

      Fn::GetAtt:

        - ReportsBucket

        - Arn