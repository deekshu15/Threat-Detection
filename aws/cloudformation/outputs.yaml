AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Centralized CloudFormation outputs for the
  AI-Assisted Threat Detection Dashboard.

Parameters:

  VpcId:

    Type: String

  PublicSubnetId:

    Type: String

  PrivateSubnetId:

    Type: String

  SecurityGroupId:

    Type: String

  RawLogsBucket:

    Type: String

  ProcessedLogsBucket:

    Type: String

  ModelsBucket:

    Type: String

  ReportsBucket:

    Type: String

  ThreatTable:

    Type: String

  IOCTable:

    Type: String

  AssetTable:

    Type: String

  IncidentTable:

    Type: String

  UserTable:

    Type: String

  ThreatEnrichmentLambdaArn:

    Type: String

  FeatureEngineeringLambdaArn:

    Type: String

  MLEngineLambdaArn:

    Type: String

  RiskEngineLambdaArn:

    Type: String

  RecommendationLambdaArn:

    Type: String

  IncidentCorrelationLambdaArn:

    Type: String

  ApiEndpoint:

    Type: String

  CriticalTopicArn:

    Type: String

  HighTopicArn:

    Type: String

  MediumTopicArn:

    Type: String

  KinesisStreamArn:

    Type: String

  QuickSightDashboardArn:

    Type: String

Outputs:

###########################################################################
# Networking
###########################################################################

  VPC:

    Description: VPC ID

    Value:

      Ref: VpcId

    Export:

      Name: ThreatDetection-VPC


  PublicSubnet:

    Description: Public Subnet

    Value:

      Ref: PublicSubnetId

    Export:

      Name: ThreatDetection-PublicSubnet


  PrivateSubnet:

    Description: Private Subnet

    Value:

      Ref: PrivateSubnetId

    Export:

      Name: ThreatDetection-PrivateSubnet


  SecurityGroup:

    Description: Security Group

    Value:

      Ref: SecurityGroupId

    Export:

      Name: ThreatDetection-SecurityGroup


###########################################################################
# S3
###########################################################################

  RawLogsBucketOutput:

    Value:

      Ref: RawLogsBucket

    Export:

      Name: ThreatDetection-RawLogsBucket


  ProcessedLogsBucketOutput:

    Value:

      Ref: ProcessedLogsBucket

    Export:

      Name: ThreatDetection-ProcessedLogsBucket


  ModelsBucketOutput:

    Value:

      Ref: ModelsBucket

    Export:

      Name: ThreatDetection-ModelsBucket


  ReportsBucketOutput:

    Value:

      Ref: ReportsBucket

    Export:

      Name: ThreatDetection-ReportsBucket


###########################################################################
# DynamoDB
###########################################################################

  ThreatTableOutput:

    Value:

      Ref: ThreatTable

    Export:

      Name: ThreatDetection-ThreatTable


  IOCTableOutput:

    Value:

      Ref: IOCTable

    Export:

      Name: ThreatDetection-IOCTable


  AssetTableOutput:

    Value:

      Ref: AssetTable

    Export:

      Name: ThreatDetection-AssetTable


  IncidentTableOutput:

    Value:

      Ref: IncidentTable

    Export:

      Name: ThreatDetection-IncidentTable


  UserTableOutput:

    Value:

      Ref: UserTable

    Export:

      Name: ThreatDetection-UserTable


###########################################################################
# Lambda
###########################################################################

  ThreatEnrichmentLambda:

    Value:

      Ref: ThreatEnrichmentLambdaArn

    Export:

      Name: ThreatDetection-ThreatEnrichmentLambda


  FeatureEngineeringLambda:

    Value:

      Ref: FeatureEngineeringLambdaArn

    Export:

      Name: ThreatDetection-FeatureEngineeringLambda


  MLEngineLambda:

    Value:

      Ref: MLEngineLambdaArn

    Export:

      Name: ThreatDetection-MLEngineLambda


  RiskEngineLambda:

    Value:

      Ref: RiskEngineLambdaArn

    Export:

      Name: ThreatDetection-RiskEngineLambda


  RecommendationLambda:

    Value:

      Ref: RecommendationLambdaArn

    Export:

      Name: ThreatDetection-RecommendationLambda


  IncidentCorrelationLambda:

    Value:

      Ref: IncidentCorrelationLambdaArn

    Export:

      Name: ThreatDetection-IncidentCorrelationLambda


###########################################################################
# API Gateway
###########################################################################

  ApiGatewayEndpoint:

    Value:

      Ref: ApiEndpoint

    Export:

      Name: ThreatDetection-ApiEndpoint


###########################################################################
# SNS
###########################################################################

  CriticalTopic:

    Value:

      Ref: CriticalTopicArn

    Export:

      Name: ThreatDetection-CriticalTopic


  HighTopic:

    Value:

      Ref: HighTopicArn

    Export:

      Name: ThreatDetection-HighTopic


  MediumTopic:

    Value:

      Ref: MediumTopicArn

    Export:

      Name: ThreatDetection-MediumTopic


###########################################################################
# Kinesis
###########################################################################

  KinesisStream:

    Value:

      Ref: KinesisStreamArn

    Export:

      Name: ThreatDetection-KinesisStream


###########################################################################
# QuickSight
###########################################################################

  Dashboard:

    Value:

      Ref: QuickSightDashboardArn

    Export:

      Name: ThreatDetection-QuickSightDashboard